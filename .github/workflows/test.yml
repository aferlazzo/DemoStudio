name: Verify demoMaker
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check public/app.js
      - run: node --check public/guide.js
      - run: node --check public/narration.js
      - run: node --check media.mjs
      - run: node --check server.mjs
      - run: npm test
